status:
  scope: >-
    Complete for the DOZZ formula of Kupiainen, Rhodes and Vargas (Theorem 2.4)
    on the extended Seiberg domain, for all 0 < gamma < 2 and mu > 0, with the
    unit-volume form at every point including the poles of Gamma(s), and for
    the identification of the reflection coefficient (Theorem 3.5). The
    structure constant is the moment formula for the Gaussian multiplicative
    chaos of the equator-pinned field; for s > 0 it is also proved to be the
    limit of the finite-position three-point moment formula as the third
    insertion goes to infinity. The Liouville path integral and its
    regularized vertex operators are not formalized, nor are the Ward
    identities and stress-energy tensor of Kupiainen, Rhodes and Vargas
    (2019), and the Liouville field on a general metric, the Weyl anomaly
    and gamma >= 2 of David, Kupiainen, Rhodes and Vargas (2016).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "DOZZ.dozz_main"
      file: "DOZZ/Statements/Roots/DozzMain.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparators/DOZZ/comparator.json"
      literature_dependencies: []
    - declaration: "DOZZ.dozz_unitVolume"
      file: "DOZZ/Statements/Roots/DozzUnitVolume.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparators/DOZZ/comparator.json"
      literature_dependencies: []
    - declaration: "DOZZ.dozz_existence"
      file: "DOZZ/Statements/Roots/DozzExistence.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
