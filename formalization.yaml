version: "v0.4"

project:
  name: "Integrability of Liouville theory: the Kupiainen–Rhodes–Vargas proof of the DOZZ formula"
  description: >-
    A Lean 4 / Mathlib formalization of the theorem of A. Kupiainen, R. Rhodes
    and V. Vargas (Annals of Mathematics, 2020) that the three-point structure
    constants of Liouville conformal field theory on the Riemann sphere are
    given by the DOZZ formula of Dorn–Otto and Zamolodchikov–Zamolodchikov.
    The structure constants are defined probabilistically: for 0 < gamma < 2,
    cosmological constant mu > 0 and charges satisfying the extended Seiberg
    bounds, C_gamma(alpha_1, alpha_2, alpha_3) = 2 mu^(-s) gamma^(-1) Gamma(s)
    E[rho^(-s)], where rho integrates explicit power weights against the
    Gaussian multiplicative chaos of the Gaussian free field pinned on the
    equator. The formalization proves C_gamma = C_gamma^DOZZ, expressed through
    the Zamolodchikov function Upsilon_{gamma/2}, at every point of the domain
    where Gamma(s) is finite, and at every point including the poles for the
    unit-volume constant; and it proves that the probabilistic reflection
    coefficient, built from Brownian motion conditioned to stay negative and
    lateral chaos, equals R^DOZZ (Theorem 3.5). The theorems hold for every
    model of the field and chaos, and models are constructed. All
    prerequisites are proved: the construction, uniqueness and moment theory
    of Gaussian multiplicative chaos and the extended Seiberg bounds (David,
    Kupiainen, Rhodes and Vargas, 2016); the BPZ equations for degenerate
    four-point functions and the classification of their real single-valued
    solutions by the Gauss hypergeometric function (Kupiainen, Rhodes and
    Vargas, 2019); analytic continuation of correlation functions, tail
    estimates for multiplicative chaos, fusion asymptotics, the shift
    equations and the quotient argument. Errata found in the three papers,
    and the places where the Lean statements differ from them, are recorded in
    docs/ERRATA-AND-DEVIATIONS.md.
  authors:
    - "Scott Armstrong"
    - "Amélie Loher"
  responsible_maintainers:
    - "Scott Armstrong"
    - "Amélie Loher"
  affiliations:
    - "Scott Armstrong: CNRS and Laboratoire Jacques-Louis Lions, Sorbonne Université; Courant Institute School of Mathematics, Computing, and Data Science, New York University"
    - "Amélie Loher: All Souls College, University of Oxford"
  license: "Apache-2.0"
  funding:
    - "Scott Armstrong was supported by the European Research Council (ERC) under the European Union's Horizon Europe research and innovation programme, grant agreement No. 101200828."
    - "Amélie Loher acknowledges support from the Fondation Sciences Mathématiques de Paris."

