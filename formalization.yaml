automation:
  methods:
    - method: "agent"
      models:
        - "gpt-6.1-sol"
        - "gpt-6-luna"
        - "claude-opus-5-5"
        - "claude-sonnet-5-5"
      framework: >-
        Codex (GPT-6.1 Sol, GPT-6 Luna) and Claude Code (Claude Opus 5.5
        coordinating, Claude Sonnet 5.5), under the authors' supervision.
      tool_setup: >-
        Lean 4 and Mathlib v4.35.0-rc2. A dependency graph of the papers'
        results was built first; every public definition and theorem
        statement was written, compared with the sources by an independent
        model review, and approved by the authors before its proof was
        developed. Verification uses full builds from a clean checkout, axiom
        checks, and Mathlib-only comparator challenges checked with Lean's
        comparator and the independent kernel checkers bundled with the
        toolchain.
      cost:
        wall_time: "about three days of development (October 2026) plus release preparation"
        spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
        hardware: "one 8-CPU / 30 GB RAM Linux machine"
      prompting_notes: >-
        The authors determined the scope and the statements, ruled on every
        deviation from the printed statements, and approved every public
        statement. Errata and gaps in the printed proofs were identified and
        repaired by arguments proposed by the models and checked by separate
        model reviews and numerical checks before they were formalized.
  spend_usd: "not separately tracked (ChatGPT Pro and Claude Max subscriptions)"
  notes: >-
    All Lean code was written by the listed models under the supervision of
    the authors. Every proof is checked by the Lean kernel; the library
    contains no sorry and no custom axiom. The comparator Challenge files
    contain one intentional theorem-body placeholder per theorem, proved by
    the corresponding Solution files.

fidelity:
  divergences: >-
    The structure constant is the Gaussian multiplicative chaos moment
    formula of the paper; the path-integral definition is not formalized.
    At the poles of Gamma(s) the paper sets correlations to infinity; the
    formalization instead states the unit-volume identity at every point as a
    limit. The field, the chaos and Upsilon_{gamma/2} are characterized by
    predicates, theorems hold for every model, and existence and uniqueness
    are separate theorems. Identities between meromorphic functions are
    stated off discrete exceptional sets, as Mathlib's Gamma function takes
    the value 0 at its poles. "Small enough" parameters are replaced by
    explicit windows. The quotient argument of the last section is completed
    without comparing zeros and poles, and the normalization is fixed at
    s = 0. Thirty errata of the main paper, seventeen of David, Kupiainen,
    Rhodes and Vargas (2016) and sixteen of Kupiainen, Rhodes and Vargas
    (2019) are corrected. All deviations are listed in
    docs/ERRATA-AND-DEVIATIONS.md.

review:
  status: "author-verified"
  reviewers:
    - "Scott Armstrong"
    - "Amélie Loher"
  notes: >-
    Lean checks each proof against its formal statement. The authors reviewed
    that the statements are the intended theorems. Each public statement was
    compared with the sources by independent model reviews before its proof
    was accepted, and the comparator declarations are checked mechanically.
    This is not external peer review.

alignment:
  - source: "Kupiainen-Rhodes-Vargas (2020), Theorem 2.4"
    lean: "DOZZ.dozz_main"
    note: "C_gamma = C_gamma^DOZZ on the extended Seiberg domain where Gamma(s) is finite, for every model of the equator-pinned field and its chaos and every Upsilon_{gamma/2}."
  - source: "Kupiainen-Rhodes-Vargas (2020), Theorem 2.4 and Section 2"
    lean: "DOZZ.dozz_unitVolume"
    note: "The unit-volume constant mu^s C_gamma / Gamma(s) equals the corresponding limit of the DOZZ formula at every point of the extended Seiberg domain, including the poles of Gamma(s)."
  - source: "David-Kupiainen-Rhodes-Vargas (2016); Kupiainen-Rhodes-Vargas (2020), Section 2"
    lean: "DOZZ.dozz_existence"
    note: "Existence of Upsilon_{gamma/2}, of the equator-pinned Gaussian free field and of its Gaussian multiplicative chaos, for every 0 < gamma < 2."
  - source: "Kupiainen-Rhodes-Vargas (2020), Theorem 3.5"
    lean: "DOZZ.reflection_Rtheor_off_poles"
    note: "R(alpha) = R^DOZZ(alpha) for gamma/2 < alpha < Q off the points where 2(Q - alpha)/gamma is a positive integer."
  - source: "Kupiainen-Rhodes-Vargas (2020), Theorem 3.5"
    lean: "DOZZ.reflection_Rtheor_punctured"
    note: "At the excluded points, R - R^DOZZ tends to 0."

