name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check axioms
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        # The library build needs about 25 GB (Mathlib cache and project build); the runner image
        # ships with far less free space, so remove preinstalled toolchains this project does not use.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py
      - name: Check for unfinished proofs outside the Challenges
        # Comments and string literals are removed first, so prose such as "admit" in a docstring
        # is not mistaken for a tactic.
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          roots = [pathlib.Path(p) for p in ("DOZZ", "GaussianFields", "DOZZ.lean", "GaussianFields.lean")]
          files = [f for r in roots for f in ([r] if r.is_file() else sorted(r.rglob("*.lean")))]
          files += sorted(pathlib.Path("comparators").glob("*/Solution.lean"))
          def code_only(text):
              out, i, depth, n = [], 0, 0, len(text)
              while i < n:
                  if text.startswith("/-", i):
                      depth += 1; i += 2; continue
                  if depth and text.startswith("-/", i):
                      depth -= 1; i += 2; continue
                  if depth:
                      out.append("\n" if text[i] == "\n" else " "); i += 1; continue
                  if text.startswith("--", i):
                      j = text.find("\n", i); i = n if j < 0 else j; continue
                  if text[i] == '"':
                      j = i + 1
                      while j < n and text[j] != '"':
                          j += 2 if text[j] == "\\" else 1
                      out.append('""'); i = j + 1; continue
                  out.append(text[i]); i += 1
              return "".join(out)
          bad = 0
          for f in files:
              for k, line in enumerate(code_only(f.read_text()).splitlines(), 1):
                  if re.search(r"\b(sorry|admit)\b", line) or re.match(r"\s*(@\[[^]]*\]\s*)?((private|protected|noncomputable)\s+)*axiom\s", line):
                      print(f"{f}:{k}: {line.strip()}"); bad += 1
          if bad:
              sys.exit("unexpected sorry/admit/axiom")
          print(f"checked {len(files)} files: no sorry, admit or axiom")
          PY
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Print and check axioms of the main theorems and the comparator theorems
        run: |
          python3 - "$RUNNER_TEMP/Axioms.lean" <<'PY'
          import json, pathlib, sys
          library = {
              "DOZZ.Statements.Roots.DozzMain": "DOZZ.dozz_main",
              "DOZZ.Statements.Roots.DozzUnitVolume": "DOZZ.dozz_unitVolume",
              "DOZZ.Statements.Roots.DozzExistence": "DOZZ.dozz_existence",
              "DOZZ.Statements.Brownian.ReflectionRtheorOffPoles": "DOZZ.reflection_Rtheor_off_poles",
              "DOZZ.Statements.Brownian.ReflectionRtheorPunctured": "DOZZ.reflection_Rtheor_punctured",
          }
          imports, names = list(library), list(library.values())
          for cfg in sorted(pathlib.Path("comparators").glob("*/comparator.json")):
              c = json.loads(cfg.read_text())
              imports.append(c["solution_module"])
              names += c["theorem_names"]
          src = "".join(f"import {m}\n" for m in imports) + "".join(f"#print axioms {n}\n" for n in names)
          pathlib.Path(sys.argv[1]).write_text(src)
          pathlib.Path(sys.argv[1] + ".count").write_text(str(len(names)))
          PY
          lake env lean "$RUNNER_TEMP/Axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          n=$(cat "$RUNNER_TEMP/Axioms.lean.count")
          # Lean may wrap long axiom lists over several lines; count on the flattened output.
          flat=$(tr '\n' ' ' < "$RUNNER_TEMP/axioms.txt" | tr -s ' ')
          test "$(grep -o "depends on axioms: \[propext, Classical.choice, Quot.sound\]" <<< "$flat" | wc -l)" -eq "$n"
          test "$(grep -o "depends on axioms" <<< "$flat" | wc -l)" -eq "$n"
